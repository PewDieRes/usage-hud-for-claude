<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 260px; margin: 0; padding: 14px; background: #18181b; color: #fafafa;
    font: 12px ui-sans-serif, system-ui, sans-serif; }
  .row { margin-bottom: 12px; }
  .label { font-size: 10px; color: #a1a1aa; font-weight: 600; text-transform: uppercase; display: flex; justify-content: space-between; }
  .bar-bg { height: 8px; background: #27272a; border-radius: 4px; overflow: hidden; margin: 4px 0; }
  .bar-fill { height: 100%; width: 0; background: #d97706; transition: width .4s; }
  .bar-fill.hot { background: #dc2626; }
  .sub { color: #a1a1aa; font-size: 11px; }
  #err { color: #f87171; }
</style>
</head>
<body>
  <div class="row"><div class="label"><span>Session (5h)</span><span id="s-val">--%</span></div>
    <div class="bar-bg"><div id="s-fill" class="bar-fill"></div></div><div class="sub" id="s-reset">resets in --</div></div>
  <div class="row"><div class="label"><span>Weekly (7d)</span><span id="w-val">--%</span></div>
    <div class="bar-bg"><div id="w-fill" class="bar-fill"></div></div><div class="sub" id="w-reset">resets in --</div></div>
  <div id="err" hidden></div>
  <script src="usage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
